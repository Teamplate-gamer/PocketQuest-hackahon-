<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pocket Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Lilita+One&family=Oxanium:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#2a1f4d;--mut:#6c6489;--line:#f0dfb0;--ac:#1f9d8a;--on:#fff;--sun:#ffb703;--red:#e0436b;--r:22px;--fs:17px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0e1424;--card:#172038;--ink:#e8edff;--mut:#97a3c7;--line:#26335a;--ac:#3dd6b5;--on:#0e1424;--sun:#7aa2ff;--r:8px;--fs:15px;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1424;--card:#172038;--ink:#e8edff;--mut:#97a3c7;--line:#26335a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 Lexend,system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px}h1{font-size:1.4em;margin:0;font-weight:800}h2{font-size:1.05em;margin:0 0 8px;font-weight:800}
.tabs{display:flex;gap:4px;margin:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:9px 2px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);font:600 .72em Lexend,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.c{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.m{color:var(--mut);font-size:.85em}.b{font-size:1.7em;font-weight:800}
input,select{width:100%;padding:11px;border-radius:calc(var(--r)/2);border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:3px 0}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1 1 130px}
button{font:inherit}.bt{padding:11px 14px;border:0;border-radius:calc(var(--r)/1.5);font-weight:800;cursor:pointer;background:var(--ac);color:var(--on)}
.bt.y{background:var(--sun);color:#14213d}.bt.n{background:var(--red);color:#fff}.bt:disabled{opacity:.4}
.ch{padding:8px 12px;border-radius:99px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-weight:600}.ch[aria-pressed=true]{background:var(--sun);color:#14213d;border-color:var(--ink)}
.i{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.i small{display:block;color:var(--mut)}
.bd{padding:2px 9px;border-radius:99px;background:var(--sun);color:#14213d;font-size:.75em;font-weight:800}
.t{min-height:24px;color:var(--ac);font-weight:600}.t.e{color:var(--red)}
.nt{background:var(--sun);color:#14213d;border-radius:var(--r);padding:12px;margin-bottom:12px;font-weight:600}
.bar{height:16px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ac)}
.lit{background:var(--sun)!important;color:#14213d!important;box-shadow:0 0 0 4px var(--line),0 0 18px var(--sun);animation:hop .7s ease-in-out infinite alternate}
.pd{animation:hop .7s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-8px)}}
.eating .arm{transform-origin:100px 118px;animation:arm 2.9s ease-in-out forwards}.eating .hs{animation:hs 2.9s forwards}.eating .mo{transform-box:fill-box;transform-origin:center;animation:mo 2.9s forwards}
.eating .st{animation:gone .25s forwards;animation-delay:calc(2.4s*(var(--n) - var(--i))/var(--n))}
@keyframes gone{to{opacity:0;transform:translateY(10px)}}
@keyframes arm{0%{transform:rotate(0)}10%,14%{transform:rotate(-65deg)}26%,38%{transform:rotate(135deg)}46%,50%{transform:rotate(-65deg)}62%,72%{transform:rotate(135deg)}80%,84%{transform:rotate(-65deg)}94%,100%{transform:rotate(135deg)}}
@keyframes hs{0%,9%{opacity:0}10%,30%{opacity:1}32%,45%{opacity:0}50%,70%{opacity:1}72%,81%{opacity:0}84%,96%{opacity:1}100%{opacity:0}}
@keyframes mo{0%,20%{opacity:0}24%{opacity:1;transform:scaleY(1)}30%{opacity:1;transform:scaleY(.3)}38%,56%{opacity:0}60%{opacity:1;transform:scaleY(1)}66%{opacity:1;transform:scaleY(.3)}72%,88%{opacity:0}92%{opacity:1;transform:scaleY(1)}96%,100%{opacity:1;transform:scaleY(.3)}}
.fl{position:absolute;top:-50px;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(40deg)}}
.pm{position:absolute;top:35%;left:50%;transform:translateX(-50%);background:var(--sun);color:#14213d;padding:12px 18px;border-radius:var(--r);font-weight:800;text-align:center;width:max-content;max-width:90%}
@media(prefers-reduced-motion:reduce){.pd,.lit,.eating .arm,.eating .hs,.eating .mo{animation:none}.fl{display:none}}
.pm{z-index:51;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink),0 0 30px #ffc40099;background:linear-gradient(135deg,#ffe36a,#ff9f1c);font-family:var(--hf);font-size:clamp(20px,5vw,30px);text-shadow:0 2px 0 #fff8;animation:celebrate-pop .55s ease-in-out infinite alternate}
@keyframes celebrate-pop{from{transform:translateX(-50%) scale(.96)}to{transform:translateX(-50%) scale(1.04)}}
.pm-detail{font:800 .58em Lexend,system-ui,sans-serif;margin-top:5px;text-shadow:none}
[data-theme=dark] .pm{background:linear-gradient(135deg,#00e0ff,#8a6bff);color:#071020;border-color:#d8f7ff;box-shadow:0 0 0 2px #000,0 0 34px #00e0ff99}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}[hidden]{display:none!important}
:root{--bg:#bfe6ff;--card:#fff;--ink:#10194d;--mut:#4a5b9a;--line:#bcd3f5;--ac:#2f6bff;--on:#fff;--sun:#ffc400;--red:#ff3b5c;--r:18px;--hf:'Lilita One',Lexend,sans-serif}
body{background:radial-gradient(#ffffffaa 2px,transparent 2.5px) 0 0/28px 28px,linear-gradient(180deg,#6fc7ff,#d6efff 320px,#eaf7ff);background-attachment:fixed}
h1,h2,.b{font-family:var(--hf);font-weight:400;letter-spacing:.4px}
h1{color:#fff;font-size:1.8em;text-shadow:0 3px 0 #10194d;-webkit-text-stroke:1px #10194d}.b{color:var(--ac)}
.ms{--card:#fff;--ink:#12142b}
.c{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.bt{font-family:var(--hf);font-weight:400;font-size:1.05em;letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,#6b97ff,#2f6bff);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.bt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bt.y{background:linear-gradient(180deg,#ffe36a,#ffb300);color:#10194d;text-shadow:none}.bt.n{background:linear-gradient(180deg,#ff7d96,#ff3b5c)}
.bt:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}.bt.lit{box-shadow:0 5px 0 var(--ink),0 0 26px 8px var(--sun)}
.ch{border:3px solid var(--ink);font-weight:800}.ch[aria-pressed=true]{background:linear-gradient(180deg,#ffe36a,#ffb300);box-shadow:0 3px 0 var(--ink)}
.tabs button{border:3px solid var(--ink);font-weight:800;box-shadow:0 3px 0 var(--ink)}.tabs button[aria-selected=true]{background:linear-gradient(180deg,#6b97ff,#2f6bff);color:#fff}
input,select{border:3px solid var(--ink)}.nt{border:3px solid var(--ink)}.bar{border:3px solid var(--ink);height:22px}.bar i{background:linear-gradient(90deg,#3ddc84,#b6ff3c)}
:root[data-theme=dark]{--bg:#070a12;--card:#0f1528;--ink:#e8f1ff;--mut:#8696c4;--line:#1d2a4d;--ac:#00e0ff;--on:#001018;--sun:#ff8a1f;--red:#ff3d5a;--r:3px;--hf:Oxanium,Lexend,sans-serif}
[data-theme=dark] body{background:linear-gradient(#ffffff09 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,#ffffff09 1px,transparent 1px) 0 0/34px 34px,radial-gradient(800px 380px at 85% -5%,#0a4a7a88,transparent),radial-gradient(700px 400px at -10% 25%,#5a1f8a66,transparent),#070a12;background-attachment:fixed}
[data-theme=dark] h1{background:linear-gradient(90deg,#00e0ff,#8a6bff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;-webkit-text-stroke:0;font-weight:800}
[data-theme=dark] h2,[data-theme=dark] .b{font-weight:800}[data-theme=dark] .b{color:var(--ac);text-shadow:0 0 18px #00e0ff66}
[data-theme=dark] .c{border:1px solid var(--line);border-left:4px solid var(--ac);box-shadow:0 8px 24px #0008;background:linear-gradient(160deg,#141c38,#0b1022)}
[data-theme=dark] .bt{font-weight:800;color:#001018;background:linear-gradient(135deg,#00e0ff,#0a84ff);border:1px solid #7df3ff;border-radius:3px;box-shadow:0 0 0 1px #000,0 0 16px #00e0ff66;text-shadow:none}
[data-theme=dark] .bt:hover:not(:disabled){filter:brightness(1.15);box-shadow:0 0 0 1px #000,0 0 26px #00e0ffaa}[data-theme=dark] .bt:active:not(:disabled){transform:translateY(1px)}
[data-theme=dark] .bt.y{background:linear-gradient(135deg,#ffb347,#ff6a00);border-color:#ffd199;color:#1a0a00;box-shadow:0 0 0 1px #000,0 0 16px #ff8a1f66}
[data-theme=dark] .bt.n{background:linear-gradient(135deg,#ff5a75,#d1163a);border-color:#ff9fb0;color:#fff;box-shadow:0 0 0 1px #000,0 0 16px #ff3d5a66}
[data-theme=dark] .bt.lit{box-shadow:0 0 0 1px #000,0 0 30px 8px #ff8a1f}
[data-theme=dark] .ch{border:1px solid var(--line);background:#0b1124}[data-theme=dark] .ch[aria-pressed=true]{background:linear-gradient(135deg,#ffb347,#ff6a00);color:#1a0a00;border-color:#ffd199;box-shadow:0 0 14px #ff8a1f66}
[data-theme=dark] .tabs button{border:1px solid var(--line);background:#0b1124;box-shadow:none;font-family:var(--hf);font-weight:800}[data-theme=dark] .tabs button[aria-selected=true]{background:linear-gradient(135deg,#00e0ff,#0a84ff);color:#001018;box-shadow:0 0 16px #00e0ff66}
[data-theme=dark] input,[data-theme=dark] select{border:1px solid var(--line);background:#080d1c}[data-theme=dark] .bar{border:1px solid var(--line);height:14px}[data-theme=dark] .bar i{background:linear-gradient(90deg,#00e0ff,#8a6bff)}[data-theme=dark] .nt{border:0;background:linear-gradient(135deg,#ff8a1f,#ff5a1f);color:#1a0a00}

.mascot-picker .mascot-food{float:right;font:600 .8em Lexend,sans-serif;opacity:.9}
.teen-picker .mascot-choice{background:linear-gradient(135deg,#152440,#252052);border:2px solid #00d9ff;color:#effaff;box-shadow:0 4px 0 #020817,0 0 12px #00d9ff33}
.teen-picker .mascot-choice:nth-of-type(2){border-color:#ffb347}
.teen-picker .mascot-choice:nth-of-type(3){border-color:#a78bfa}
.teen-picker .mascot-choice:nth-of-type(4){border-color:#ff5e85}

</style></head><body><div class="w">
<div class="r" style="align-items:center;flex-wrap:nowrap"><h1>🐼 Pocket Quest</h1><label class="m" style="flex:0 0 auto"><input type="checkbox" id="demo" style="width:auto"> Demo mode</label><button class="ch" style="flex:0 0 auto" data-a="sty">Style</button></div>
<div class="m">Made-up money only. Use nicknames, never real details.</div>
<div id="accountBar"></div><div id="app"></div></div>
<script>
const $=s=>document.querySelector(s),inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sam=a=>(Math.round(a/20*10)/10)+" samosas 🥟",tm=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const TIPS=["Needs first, wants later.","Save a little every time money comes in.","Ask: will I still want this tomorrow?","Small spends add up fast.","A goal with a price is easier to reach.","Sharing is a smart use of money too."];
const seed=()=>({st:null,gt:"New bicycle",gp:1500,sp:500,sv:0,start:500,wk:100,lim:100,id:1,tx:[],req:[],ch:[],wl:[{n:"Football",p:600},{n:"Art kit",p:350}],fr:null,streak:0,done:0});
const ACCOUNT_KEY="pq-accounts-v1";
let DB={accounts:{},active:null},activeId=null,S=null,P=false,tab="home",meth="Amazon",nw="need",msg="",me=false;
function persistAccounts(){try{localStorage.setItem(ACCOUNT_KEY,JSON.stringify(DB))}catch(e){}}
function loadAccounts(){
  try{const stored=JSON.parse(localStorage.getItem(ACCOUNT_KEY));if(stored&&stored.accounts&&typeof stored.accounts==="object")DB=stored;}catch(e){}
  if(!DB||!DB.accounts){DB={accounts:{},active:null};}
  if(!Object.keys(DB.accounts).length){
    let old=null;try{old=JSON.parse(localStorage.getItem("pq-v3"))}catch(e){}
    if(old&&typeof old==="object"){
      DB.accounts.legacy={id:"legacy",name:"My Account",pin:"",data:old};
      DB.active="legacy";
    }
  }
  if(DB.active&&DB.accounts[DB.active]){activeId=DB.active;S=DB.accounts[activeId].data||seed();}
  else{activeId=null;DB.active=null;S=null;}
  persistAccounts();
}
loadAccounts();
const save=()=>{if(!activeId||!S||!DB.accounts[activeId])return;DB.accounts[activeId].data=S;DB.active=activeId;persistAccounts()};
const K=()=>S.st==="kid",W=(k,t)=>K()?k:t;
const log=o=>S.tx.push({id:S.id++,time:Date.now(),k:"",who:"",...o});
const say=(t,e)=>{msg=t;me=!!e;render()};
function panda(){const has=S.gp>0,n=has?Math.max(0,Math.min(12,Math.round(S.sv/S.gp*12))):0,full=has&&S.sv>=S.gp;let s="";
for(let i=0;i<n;i++){const h=50+(i%3)*14;s+=`<g class="st" style="--i:${i}"><rect x="${150+i*11}" y="${168-h}" width="7" height="${h}" rx="2" fill="#4caf50"/><rect x="${150+i*11}" y="${168-h/2}" width="7" height="2" fill="#2e7d32"/></g>`}
const mouth=n>5||full||!has?"M62 88Q75 100 88 88":n>1?"M64 92H86":"M63 96Q75 86 87 96";
return `<svg viewBox="0 0 300 190" width="100%" style="--n:${n}" role="img" aria-label="Panda with ${n} bamboo stalks"><g class="${full?"pd":""}"><ellipse cx="75" cy="135" rx="48" ry="40" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/><ellipse cx="42" cy="140" rx="12" ry="22" fill="var(--ink)"/><circle cx="75" cy="70" r="36" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/><circle cx="48" cy="40" r="12" fill="var(--ink)"/><circle cx="102" cy="40" r="12" fill="var(--ink)"/><ellipse cx="60" cy="68" rx="8" ry="11" fill="var(--ink)"/><ellipse cx="90" cy="68" rx="8" ry="11" fill="var(--ink)"/><circle cx="61" cy="66" r="3" fill="var(--card)"/><circle cx="89" cy="66" r="3" fill="var(--card)"/><ellipse cx="75" cy="82" rx="6" ry="4" fill="var(--ink)"/><path d="${mouth}" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse class="mo" cx="75" cy="92" rx="9" ry="7" fill="var(--ink)" opacity="0"/><g class="arm"><ellipse cx="108" cy="140" rx="12" ry="22" fill="var(--ink)"/><rect class="hs" x="105" y="148" width="7" height="22" rx="2" fill="#4caf50" opacity="0"/></g></g><g id="bam">${s}</g><rect x="140" y="168" width="150" height="8" rx="3" fill="var(--mut)"/></svg>`}
function home(){const has=S.gp>0,left=Math.max(0,S.gp-S.sv),tot=S.sp+S.sv,mood=!has?"No goals left! Pick a new one from your wishlist.":S.sv>=S.gp?"I’m full of joy! Claim your goal!":S.sv<S.gp*.2?W("I’m hungry. Save some "+FD()+" for me!","Stash is low. Keep saving."):W("Yum! Keep saving.","On track. Keep going.");
const o=S.tx.filter(x=>x.t==="out"),nd=o.filter(x=>x.k==="need").reduce((a,x)=>a+x.amt,0),wt=o.filter(x=>x.k==="want").reduce((a,x)=>a+x.amt,0);
const bg=[[S.sv>0,"First saver"],[S.done>0,"Goal getter"],[o.some(x=>x.k==="need"),"Smart need"],[S.ch.some(x=>x.st==="paid"),"Chore champ"],[S.streak>=3,"3-day no-spend"]];
return `<div class="c">${has?`<div class="m">${W("My goal","Goal")}: ${esc(S.gt)} (${inr(S.gp)})</div><div class="b">${inr(left)} left</div><div class="m">from your goal. ${esc(mood)}</div>`:`<div class="b">No goals left ${{panda:"🐼",lion:"🦁",wolf:"🐺",dog:"🐶",cat:"🐱"}[MN()]||"🐾"}</div><div class="m">${esc(mood)}</div><button class="bt y" data-a="gt">Choose a goal</button>`}${mas()}<button class="ch" data-a="mcx">${K()?"🐾 Change animal buddy":"Change mascot"}</button>
<div class="bar"><i style="width:${has?Math.min(100,S.sv/S.gp*100):0}%"></i></div></div>
<div class="c"><div class="m">Money now</div><div class="b">${inr(tot)}</div>${K()?`<div>That’s ${sam(tot)}</div>`:""}<div class="m">Started this month with ${inr(S.start)}${K()?" = "+sam(S.start):""}</div>
<div class="m">Spending ${inr(S.sp)} · Savings ${inr(S.sv)}</div></div>
${has?`<div class="c"><button class="bt${S.sv>=S.gp?" lit":""}" data-a="claim" style="width:100%"${S.sv>=S.gp?"":" disabled"}>${S.sv>=S.gp?W("🎉 Goal completed! Tap to claim","Goal completed"):W("🔒 Goal not done yet","Goal not completed")}</button></div>`:""}
<div class="c"><h2>💡 ${W("Money tip","Tip of the day")}</h2>${TIPS[new Date().getDate()%TIPS.length]}</div>
<div class="c"><h2>This month</h2>Needs ${inr(nd)} · Wants ${inr(wt)}. ${wt>nd?"Lots of wants!":"Nice balance."}<p><button class="bt y" data-a="nsd">No-spend day today</button> Streak: ${S.streak}</p>
<div class="r">${bg.map(b=>`<span class="ch" style="opacity:${b[0]?1:.35}">${b[0]?"🏅":"🔒"} ${b[1]}</span>`).join("")}</div></div>
<div class="c"><h2>Chores from home</h2>${S.ch.length?S.ch.slice().reverse().map(c=>`<div class="i"><div><b>${esc(c.n)}</b> · ${inr(c.a)}</div>${c.st==="todo"?`<button class="bt" data-a="chd" data-v="${c.id}">Done</button>`:`<span class="bd">${c.st==="done"?"Waiting":"Paid"}</span>`}</div>`).join(""):`<span class="m">No chores yet. A parent can add one in the Parent tab.</span>`}</div>`}
function pay(){const big=nw==="want";return `<div class="c"><h2>What do you want to pay for?</h2><div class="r" role="group">${["Amazon","DoorDash","Scan to pay","Send to a friend"].map(m=>`<button class="ch" data-a="meth" data-v="${m}" aria-pressed="${m===meth}">${{Amazon:"📦",DoorDash:"🛵","Scan to pay":"📷","Send to a friend":"💸"}[m]} ${m}</button>`).join("")}</div>
<p class="m">Practice checkout. No real money moves.</p>
${meth==="Scan to pay"?`<div style="text-align:center;font-size:64px;border:3px dashed var(--line);border-radius:var(--r);padding:8px">📷<div class="m">Point at a QR code (pretend)</div></div>`:""}
${meth==="Send to a friend"?`<label class="m" for="who">Friend’s nickname</label><input id="who" maxlength="14" placeholder="Pia">`:""}
<label class="m" for="it">What are you buying? (required)</label><input id="it" maxlength="30" placeholder="${meth==="DoorDash"?"Pizza":"Football"}">
<label class="m" for="pr">Price (₹)</label><input id="pr" type="number" min="1" inputmode="numeric" oninput="pv()">
<div class="r"><button class="ch" data-a="nw" data-v="need" aria-pressed="${!big}">Need</button><button class="ch" data-a="nw" data-v="want" aria-pressed="${big}">Want</button></div>
<div class="nt" id="pv">Type a price to see what it costs you.</div>
<label class="m" for="pin">Your PIN (demo: 1111)</label><input id="pin" type="password" maxlength="4" inputmode="numeric">
<button class="bt" data-a="pay" style="width:100%;margin-top:8px">Pay</button></div>
${S.req.filter(r=>r.st!=="ok"&&r.st!=="no").slice().reverse().map(r=>`<div class="c"><b>${esc(r.n)} · ${inr(r.a)}</b> at ${esc(r.s)}<br>${r.st==="sleep"?`😴 Sleeping on it for 24 hours. <button class="bt y" data-a="skip" data-v="${r.id}">Skip wait (demo)</button>`:"⏳ Waiting for parent’s permission…"}</div>`).join("")}`}

createAccount(){const name=$("#newName").value.trim(),pin=$("#newPin").value.trim();if(!name)return say("Enter a name for this account.",1);if(name.length>24)return say("Keep the account name under 25 characters.",1);if(pin&&!/^\d{4,12}$/.test(pin))return say("The optional account PIN must be 4 to 12 digits.",1);if(Object.values(DB.accounts).some(a=>a.name.toLowerCase()===name.toLowerCase()))return say("That account name already exists. Sign in to it or choose another name.",1);const id="user-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);DB.accounts[id]={id,name,pin,data:seed()};activeId=id;DB.active=id;S=DB.accounts[id].data;P=false;tab="home";msg="Account created! Choose your style to begin.";me=false;wd=false;persistAccounts();render()},

const who=meth==="Send to a friend"?($("#who").value.trim()||"Friend"):meth;S.req.push({id:S.id++,n:it,a,s:who,k:nw,st:nw==="want"&&a>S.lim?"sleep":"wait"});say("Request sent. Waiting for parent’s permission…")},
